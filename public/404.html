<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Azukios | Artist Portfolio</title>
    <script>
      // GitHub Pages SPA redirect hack
      // Redirects 404s to index.html with the path as a query parameter
      const path = window.location.pathname;
      const query = window.location.search;
      const hash = window.location.hash;

      // Store the path and redirect to root
      sessionStorage.setItem('redirect', path + query + hash);
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
